<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="50%" stop-color="#5e5ce6"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Phone Outline -->
  <rect x="36" y="22" width="56" height="84" rx="10" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="40" y="28" width="48" height="72" rx="6" fill="url(#screenGrad)"/>

  <!-- Camera cutout -->
  <circle cx="64" cy="33" r="2.5" fill="#555558"/>

  <!-- Magic Beam Waves -->
  <path d="M 52 56 A 16 16 0 0 1 76 56" fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 46 50 A 24 24 0 0 1 82 50" fill="none" stroke="#30d158" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="4" fill="#64d2ff"/>

  <!-- Home Indicator / Dock -->
  <rect x="56" y="93" width="16" height="2" rx="1" fill="#8e8e93"/>
</svg>
