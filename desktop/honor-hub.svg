<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="50%" stop-color="#0c111d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Energy Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Bevel Lighting Filter -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Drop Shadow Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Outer Metallic Bevel Rim -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4" opacity="0.9" />

  <!-- Inner Ambient Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" />

  <!-- Orbital Ring 1: High-Speed Fast Beam Wave -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />

  <!-- Orbital Ring 2: Dynamic Telemetry Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" stroke-dasharray="240 60" stroke-linecap="round" filter="url(#glowDrop)" />

  <!-- Central Nexus Sphere (MagicOS Emblem) -->
  <circle cx="256" cy="256" r="76" fill="#0c1427" stroke="#38bdf8" stroke-width="4" filter="url(#glowDrop)" />

  <!-- Smartphone Transmission Beam Glyph -->
  <path d="M236 210 C236 202 242 196 250 196 L262 196 C270 196 276 202 276 210 L276 302 C276 310 270 316 262 316 L250 316 C242 316 236 310 236 302 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  <!-- Phone Screen -->
  <rect x="242" y="212" width="28" height="78" rx="4" fill="url(#emeraldGrad)" opacity="0.85" />
  <!-- Home Pill -->
  <line x1="251" y1="304" x2="261" y2="304" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Radiating Beam Pulses (Left and Right) -->
  <path d="M214 236 C202 248 202 264 214 276" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M194 220 C176 242 176 270 194 292" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <path d="M298 236 C310 248 310 264 298 276" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M318 220 C336 242 336 270 318 292" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- Top Gloss Highlight Reflection -->
  <path d="M56 120 C110 56 220 44 380 72 C410 78 440 92 456 112 C380 140 220 156 110 148 C76 144 58 132 56 120 Z" fill="#ffffff" opacity="0.08" />
</svg>
